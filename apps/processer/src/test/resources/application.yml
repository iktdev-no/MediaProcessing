spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: false
    locations: classpath:flyway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  output:
    ansi:
      enabled: always

springdoc:
  swagger-ui:
    path: /open/swagger-ui

logging:
  level:
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - mappings
          - health
  endpoint:
    health:
      show-details: always

media:
  cache: build/test-cache
  outgoing: build/test-output
  incoming: build/test-input

executables:
  ffmpeg: ffmpeg

processer:
  coordinator-url: ${COORDINATOR_URL:http://coordinator:8080}
  coordinator-ping-on-startup: false
  allow-overwrite: ${ALLOW_OVERWRITE:false}

directories:
  logs: build/test-logs