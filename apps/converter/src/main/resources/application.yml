spring:
  output:
    ansi:
      enabled: always
  flyway:
    enabled: true
    locations: classpath:flyway
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.apache.kafka: INFO
    Exposed: OFF
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN


media:
  scratch: /src/scratch
  intermediate: /src/intermediate
  outbox: /src/outbox
  inbox: /src/inbox

streamit:
  address: http://streamit.service